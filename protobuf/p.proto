syntax = "proto3";

package p;

enum MessageType {
    MSG_UNKNOWN = 0;
    MSG_LOGIN = 1;
    MSG_LOGOUT = 2;
    MSG_ECHO = 3;
    MSG_HEARTBEAT = 4;
    MSG_CHAT = 5;
    MSG_FRIEND_REQUEST = 6;
    MSG_FRIEND_RESPONSE = 7;
    MSG_GROUP_CREATE = 8;
    MSG_GROUP_JOIN = 9;
    MSG_GROUP_LEAVE = 10;
    MSG_REGISTER = 11;
    MSG_VERIFICATION_CODE = 12;
    MSG_ADD_FRIEND = 13;
    MSG_PROCESS_FRIEND_REQUEST = 14;
    MSG_FRIEND_LIST = 15;
    MSG_DELETE_FRIEND = 16;
    MSG_BLOCK_USER = 17;
    MSG_UNBLOCK_USER = 18;
    MSG_BLOCK_LIST = 19;
    MSG_FRIEND_ONLINE_STATUS = 20;
    MSG_GROUP_DISMISS = 21;
    MSG_GROUP_LIST = 22;
    MSG_GROUP_MEMBERS = 23;
    MSG_SET_ADMIN = 24;
    MSG_KICK_MEMBER = 25;
    MSG_PENDING_REQUESTS = 26;
    MSG_PROCESS_REQUEST = 27;
    MSG_GROUP_NOTIFICATION = 28;
    MSG_HISTORY = 29;
    MSG_READ_RECEIPT = 30;
    MSG_UNREAD_COUNT = 31;
    MSG_CONVERSATION_LIST = 32;
    MSG_RECALL = 33;
    MSG_OFFLINE_NOTIFY = 34;
    MSG_GROUP_PUSH = 35;
    MSG_GROUP_RECALL = 36;
    MSG_GROUP_UNREAD = 37;
    MSG_GROUP_CHAT = 38;
    MSG_GROUP_HISTORY = 39;
    MSG_GROUP_READ = 40;
    MSG_FILE_UPLOAD_REQ = 41;
    MSG_FILE_UPLOAD_RESP = 42;
    MSG_FILE_UPLOAD_CHUNK = 43;
    MSG_FILE_UPLOAD_COMPLETE = 44;
    MSG_FILE_DOWNLOAD_REQ = 45;
    MSG_FILE_DOWNLOAD_RESP = 46;
    MSG_FILE_DOWNLOAD_CHUNK = 47;
    MSG_FILE_MESSAGE = 48;
    MSG_FILE_OFFLINE_NOTIFY = 49;
    MSG_FILE_RESUME_REQ = 50;
    MSG_FILE_RESUME_RESP = 51;
    MSG_FILE_OFFLINE_LIST_REQ = 52;
    MSG_FILE_OFFLINE_DOWNLOAD = 53;
    MSG_HEARTBEAT_RESP = 54;
    MSG_COMMON_RESPONSE = 55;
    MSG_VERIFY_CODE_LOGIN = 56;
    MSG_BLOCK_LIST_RESPONSE = 57;
    MSG_BLOCK_LIST_REQUEST = 58;
    MSG_FILE_CHUNK = 59;
    MSG_DELETE_ACCOUNT = 60;
    MSG_GROUP_FILE_UPLOAD_REQ = 61;
    MSG_GROUP_FILE_UPLOAD_CHUNK = 62;
    MSG_GROUP_FILE_MESSAGE = 63;
    MSG_FILE_OFFLINE_LIST_RESP = 64;
    MSG_COMMON_REQUEST = 65;
    MSG_GET_OFFLINE_MESSAGES = 66;
    MSG_OFFLINE_MESSAGES_RESP = 67;
    MSG_MARK_OFFLINE_READ = 68;
}

message MessageHeader {
    uint32 msg_id = 1;
    MessageType msg_type = 2;
    uint32 body_length = 3;
    uint64 timestamp = 4;
    uint64 from_uid = 5;
    uint64 to_uid = 6;
    uint64 request_id = 7;
}

message LoginRequest {
    string username = 1;
    string password = 2;
    string device_id = 3;
}

message LoginResponse {
    bool success = 1;
    string token = 2;
    string message = 3;
    uint64 uid = 4;
    string nickname = 5;
}

message ChatMessage {
    uint64 from_uid = 1;
    uint64 to_uid = 2;
    string content = 3;
    uint32 msg_type = 4;
    string extra = 5;
    int64 timestamp = 6;
    uint64 msg_id = 7;
}

message GroupChatMessage {
    uint64 from_uid = 1;
    uint64 group_uid = 2;
    string content = 3;
    uint32 msg_type = 4;
    string extra = 5;
    int64 timestamp = 6;
}

message FriendRequest {
    uint64 from_uid = 1;
    uint64 to_uid = 2;
    string message = 3;
}

message FriendResponse {
    uint64 from_uid = 1;
    uint64 to_uid = 2;
    bool accept = 3;
}

message GroupCreate {
    string group_name = 1;
    string description = 2;
    repeated uint64 members = 3;
}

message GroupJoin {
    uint64 group_id = 1;
    uint64 user_id = 2;
}

message EchoRequest {
    string content = 1;
}

message EchoResponse {
    string content = 1;
}

message Heartbeat {
    uint64 timestamp = 1;
    uint64 client_time = 2;  // 客户端的时间戳
    uint64 seq = 3;          // 序列号（去重）
}

message HeartbeatResp {
    uint64 timestamp = 1;
    uint64 server_time = 2;
    uint64 seq = 3;
    int64 latency_ms = 4; // 延迟毫秒
}

// 通用响应消息
message CommonResponse {
    int32 code = 1;         // 状态码
    string message = 2;     // 状态描述
    uint64 timestamp = 3;
}


// 注册请求
message RegisterRequest {
    string username = 1;
    string password = 2;
    string email = 3;
    string nickname = 4;
    string verification_code = 5;
}

// 注销请求
message LogoutRequest {
    string token = 1;
}

// 验证码请求
message CodeRequest {
    string email = 1;
}

// 验证码响应
message CodeResponse {
    string code = 1;
    int32 expire_seconds = 2;
}

// 验证码登录
message VerifyCodeLoginRequest {
    string email = 1;
    string code = 2;
    string device_id = 3;
}

message DeleteAccountRequest {
    string token = 1;      // 当前会话token，用于验证
    bool confirm = 2;
    string password = 3;
}

message DeleteAccountResponse {
    bool success = 1;
    string message = 2;
}

message FriendRequestMsg {
    uint64 to_uid = 1;
    string message = 2;
}

// 处理好友请求
message ProcessFriendRequest {
    uint64 request_id = 1;
    bool accept = 2;
}

// 好友列表响应
message FriendListResponse {
    message FriendInfo {
        uint64 user_id = 1;
        string username = 2;
        string nickname = 3;
        string avatar = 4;
        int32 status = 5;
        bool is_online = 6;
    }
    repeated FriendInfo friends = 1;
}

message GetFriendListRequest {
}

// 删除好友请求
message DeleteFriendRequest {
    uint64 friend_id = 1;
}

// 屏蔽用户请求
message BlockUserRequest {
    uint64 block_id = 1;
}

// 取消屏蔽请求
message UnblockUserRequest {
    uint64 block_id = 1;
}

message BlockListRequest {
}

// 屏蔽列表响应
message BlockListResponse {
    repeated uint64 block_ids = 1;
}

// 在线状态通知
message OnlineStatusNotification {
    uint64 user_id = 1;
    bool online = 2;
}

// 群组信息
message GroupInfo {
    uint64 group_id = 1;
    string group_name = 2;
    string group_avatar = 3;
    uint64 owner_id = 4;
    string owner_name = 5;
    string description = 6;
    int32 member_count = 7;
    bool is_public = 8;
    int32 join_type = 9;
}

// 成员信息
message GroupMemberInfo {
    uint64 user_id = 1;
    string username = 2;
    string nickname = 3;
    int32 role = 4;
    bool is_muted = 5;
    int64 join_time = 6;
}

// 申请信息
message JoinRequestInfo {
    uint64 request_id = 1;
    uint64 from_uid = 2;
    string from_username = 3;
    string message = 4;
    int64 created_at = 5;
}

// 创建群组请求
message CreateGroupRequest {
    string group_name = 1;
    string group_avatar = 2;
    string description = 3;
    string announcement = 4;
    int32 max_members = 5;
    bool is_public = 6;
    int32 join_type = 7;
    repeated uint64 initial_member_ids = 8;
}

// 创建群组响应
message CreateGroupResponse {
    bool success = 1;
    uint64 group_id = 2;
    string message = 3;
}

// 解散群组请求
message DismissGroupRequest {
    uint64 group_id = 1;
}

// 加入群组请求
message JoinGroupRequest {
    uint64 group_id = 1;
    string message = 2;
}

// 退出群组请求
message LeaveGroupRequest {
    uint64 group_id = 1;
}

// 设置管理员请求
message SetAdminRequest {
    uint64 group_id = 1;
    uint64 target_uid = 2;
    bool is_admin = 3;
}

// 踢人请求
message KickMemberRequest {
    uint64 group_id = 1;
    uint64 target_uid = 2;
}

// 处理入群申请请求
message ProcessJoinRequest {
    uint64 request_id = 1;
    bool accept = 2;
}

// 获取群组列表请求
message GetGroupListRequest {
    // 无参数
}

// 群组列表响应
message GroupListResponse {
    bool success = 1;
    string message = 2;
    repeated GroupInfo groups = 3;
}

// 获取群成员请求
message GetGroupMembersRequest {
    uint64 group_id = 1;
}

// 群成员列表响应
message GroupMembersResponse {
    bool success = 1;
    string message = 2;
    uint64 group_id = 3;
    repeated GroupMemberInfo members = 4;
}

// 获取待处理申请请求
message GetPendingRequestsRequest {
    uint64 group_id = 1;
}

// 待处理申请响应
message PendingRequestsResponse {
    bool success = 1;
    string message = 2;
    repeated JoinRequestInfo requests = 3;
}

// 群组通知
message GroupNotification {
    enum NotificationType {
        NOTIFY_NEW_MEMBER = 0;
        NOTIFY_MEMBER_LEFT = 1;
        NOTIFY_GROUP_DISMISSED = 2;
        NOTIFY_JOIN_REQUEST = 3;
        NOTIFY_REQUEST_ACCEPTED = 4;
        NOTIFY_REQUEST_REJECTED = 5;
        NOTIFY_ROLE_CHANGED = 6;
        NOTIFY_KICKED = 7;
    }
    NotificationType type = 1;
    uint64 group_id = 2;
    uint64 user_id = 3;
    string message = 4;
}

// 历史消息请求
message GetHistoryRequest {
    uint64 target_uid = 1;
    int32 limit = 2;
    int64 before_time = 3;
}

// 历史消息响应
message HistoryResponse {
    bool success = 1;
    string message = 2;
    uint64 target_uid = 3;
    repeated HistoryMessage messages = 4;
}

message HistoryMessage {
    uint64 msg_id = 1;
    uint64 from_uid = 2;
    uint64 to_uid = 3;
    string content = 4;
    int32 msg_type = 5;
    int32 status = 6;
    bool is_recalled = 7;
    int64 created_at = 8;
    int64 delivered_at = 9;
    int64 read_at = 10;
    string file_id = 11;    // 文件消息：文件ID
    uint64 file_size = 12;  // 文件消息：文件大小
    string md5 = 13;        // 文件消息：文件MD5
}

// 标记已读请求
message MarkReadRequest {
    uint64 from_uid = 1;  // 0表示全部标记
}

// 已读回执
message ReadReceipt {
    uint64 user_id = 1;
    int64 timestamp = 2;
}

// 未读数量响应
message UnreadCountResponse {
    bool success = 1;
    string message = 2;
    int32 total_unread = 3;
    repeated UnreadItem unread_items = 4;
}

message UnreadItem {
    uint64 from_uid = 1;
    int32 count = 2;
}

// 会话列表响应
message ConversationListResponse {
    bool success = 1;
    string message = 2;
    repeated ConversationItem conversations = 3;
}

message ConversationListRequest {

}

message ConversationItem {
    uint64 user_id = 1;
    string username = 2;
    string nickname = 3;
    string avatar = 4;
    string last_msg_content = 5;
    int64 last_msg_time = 6;
    int32 unread_count = 7;
    int32 online_status = 8;
}

// 撤回消息请求
message RecallMessageRequest {
    uint64 msg_id = 1;
}

// 消息撤回通知
message MessageRecall {
    uint64 msg_id = 1;
    uint64 from_uid = 2;
    uint64 to_uid = 3;
    int64 recalled_at = 4;
}

// 离线消息通知
message OfflineMessageNotify {
    int32 count = 1;
    int64 timestamp = 2;
    int32 group_count = 3;
    int32 total_count = 4;
    int32 private_count = 5;
}

message OnlineStatusRequest {
    repeated uint64 target_ids = 1;  // 要查询的用户ID列表，为空则返回所有好友
}

// 添加在线状态响应
message OnlineStatusResponse {
    bool success = 1;
    string message = 2;
    
    message OnlineInfo {
        uint64 user_id = 1;
        string username = 2;
        string nickname = 3;
        string avatar = 4;
        bool is_online = 5;
    }
    
    repeated OnlineInfo online_info = 3;
}

message GroupChatRequest {
    uint64 group_id = 1;
    string content = 2;
    int32 msg_type = 3;
    string extra = 4;
}

message GroupMessagePush {
    uint64 msg_id = 1;
    uint64 group_id = 2;
    uint64 from_uid = 3;
    string from_username = 4;
    string content = 5;
    int32 msg_type = 6;
    int64 created_at = 7;
}

message GroupHistoryRequest {
    uint64 group_id = 1;
    int32 limit = 2;
    int64 before_time = 3;
}

message GroupHistoryResponse {
    bool success = 1;
    string message = 2;
    uint64 group_id = 3;
    repeated GroupHistoryItem messages = 4;
}

message GroupHistoryItem {
    uint64 msg_id = 1;
    uint64 from_uid = 2;
    string from_username = 3;
    string content = 4;
    int32 msg_type = 5;
    bool is_recalled = 6;
    int64 created_at = 7;
}

message RecallGroupMessageRequest {
    uint64 msg_id = 1;
}

message GroupRecall {
    uint64 msg_id = 1;
    uint64 group_id = 2;
    uint64 from_uid = 3;
    int64 recalled_at = 4;
}

message MarkGroupReadRequest {
    uint64 group_id = 1;
    uint64 last_msg_id = 2;
}

message GroupUnreadResponse {
    bool success = 1;
    string message = 2;
    int32 total_unread = 3;
    repeated GroupUnreadItem unread_items = 4;
}

message GroupUnreadItem {
    uint64 group_id = 1;
    string group_name = 2;
    int32 unread_count = 3;
}

message GetOfflineMessagesRequest {
    int32 limit = 1;        // 最大获取数量
    int64 before_time = 2;  // 获取此时间之前的消息（用于分页）
}